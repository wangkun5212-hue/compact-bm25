[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-bm25"
version = "0.1.0"
authors = [
  { name="Wang Kun" },
]
description = "A memory-efficient BM25Okapi implementation using compact NumPy indexes."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "rank-bm25>=0.2.2",
]

[project.urls]
"Homepage" = "https://github.com/wangkun5212-hue/compact-bm25"
"Bug Tracker" = "https://github.com/wangkun5212-hue/compact-bm25/issues"
